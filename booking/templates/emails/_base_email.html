<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f6f2ed;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f2ed;padding:24px 12px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border:1px solid #e6ddd3;border-radius:14px;
                      font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
                      color:#221c17;font-size:15px;line-height:1.55">
          <tr>
            <td style="padding:22px 26px;border-bottom:1px solid #e6ddd3">
              <div style="font-size:17px;font-weight:700">{{ salon.name }}</div>
              {% if salon.tagline %}<div style="font-size:13px;color:#6b615a">{{ salon.tagline }}</div>{% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:26px">
              <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3">{% block heading %}{% endblock %}</h1>
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 26px;border-top:1px solid #e6ddd3;font-size:12px;color:#6b615a">
              {{ salon.name }}{% if salon.address %} &middot; {{ salon.address }}{% endif %}{% if salon.phone %} &middot; {{ salon.phone }}{% endif %}
              <br><a href="{{ site_url }}" style="color:#8a663f">{{ site_url }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
